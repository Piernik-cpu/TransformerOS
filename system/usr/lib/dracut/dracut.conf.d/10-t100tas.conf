# Preload MMC/SDHCI and Bay Trail PMIC/GPIO/PWM drivers so:
# 1. dracut always locates the internal eMMC root filesystem (5bentz/linux-asus-t100 #25)
# 2. i915 finds gpio_crystalcove & pwm_lpss on first probe without deferring
add_drivers+=" mmc_core mmc_block sdhci sdhci_acpi gpio_crystalcove pwm_lpss pwm_lpss_platform i915 "
compress="zstd"
hostonly="no"
