# Transparent Hugepages: madvise only to avoid latency spikes & RAM bloat on 1.81 GiB
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise

# Tune both internal eMMC and microSD regardless of dynamic mmcblk0/1/2 probe order
w /sys/block/mmcblk0/queue/scheduler - - - - mq-deadline
w /sys/block/mmcblk0/queue/nr_requests - - - - 64
w /sys/block/mmcblk0/queue/read_ahead_kb - - - - 256
w /sys/block/mmcblk1/queue/scheduler - - - - mq-deadline
w /sys/block/mmcblk1/queue/nr_requests - - - - 64
w /sys/block/mmcblk1/queue/read_ahead_kb - - - - 256
w /sys/block/mmcblk2/queue/scheduler - - - - mq-deadline
w /sys/block/mmcblk2/queue/nr_requests - - - - 64
w /sys/block/mmcblk2/queue/read_ahead_kb - - - - 256

# Keep USB1 root hub active so 0b05:17e0 ASUS Base Station dock hotplug is instant
w /sys/bus/usb/devices/usb1/power/control - - - - on
