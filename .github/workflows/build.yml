name: Build & Publish TransformerOS Atomic Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Rebuild weekly every Monday at 04:00 UTC to pull latest Fedora 45 security & kernel updates
    - cron: "0 4 * * 1"
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/piernik-cpu/transformeros

permissions:
  contents: read
  packages: write

jobs:
  build-bootc-image:
    name: Build Fedora 45 bootc Image (IA32 UEFI + x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h

      - name: Build TransformerOS image with Podman
        run: |
          podman build \
            --format oci \
            -t "${IMAGE_NAME}:latest" \
            -t "${IMAGE_NAME}:stable" \
            -t "${IMAGE_NAME}:45" \
            -f Containerfile .

      - name: Verify 32-bit IA32 UEFI binaries & TransformerOS components
        run: |
          podman run --rm "${IMAGE_NAME}:stable" bash -euxc '
            test -x /usr/bin/transformerd
            test -x /usr/bin/transformerdctl
            test -x /usr/bin/wvkbd-mobintl
            test -x /usr/bin/transformer-greeter
            test -x /usr/bin/transformer-shell
            test -x /usr/bin/transformer-session
            test -f /usr/lib/firmware/brcm/BCM4324B3.hcd
            test -f /usr/lib/firmware/brcm/brcmfmac43241b4-sdio.txt
            find /usr/lib/efi /usr/lib/bootupd/updates /usr/share/transformeros -iname "*ia32*.efi" | grep -q .
            bootc container lint || true
          '

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push TransformerOS image to GHCR
        if: github.event_name != 'pull_request'
        run: |
          podman push "${IMAGE_NAME}:latest"
          podman push "${IMAGE_NAME}:stable"
          podman push "${IMAGE_NAME}:45"
